<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The note4win icon: a variation on the Notepad icon of Windows 10, drawn
    from scratch. A light blue spiral pad on a stack of white pages with an
    amber back, four rings and three lines of text, the last one short. No
    backdrop. Everything sits on a 16 unit grid, so it stays readable at
    16 px (one grid unit is one pixel there). Rendered to PNG by
    tools/genicon.
  -->
  <defs>
    <linearGradient id="cover" gradientUnits="userSpaceOnUse" x1="32" y1="32" x2="224" y2="192">
      <stop offset="0" stop-color="#8AD4FB"/>
      <stop offset="1" stop-color="#3FA3EA"/>
    </linearGradient>
  </defs>

  <!-- back, pages, cover -->
  <rect x="32" y="96" width="192" height="128" rx="24" fill="#F29A0C"/>
  <rect x="32" y="96" width="192" height="112" rx="24" fill="#F4F7FA"/>
  <rect x="32" y="32" width="192" height="160" rx="24" fill="url(#cover)"/>

  <!-- rings -->
  <rect x="48" y="16" width="16" height="40" rx="8" fill="#0B4F9E"/>
  <rect x="96" y="16" width="16" height="40" rx="8" fill="#0B4F9E"/>
  <rect x="144" y="16" width="16" height="40" rx="8" fill="#0B4F9E"/>
  <rect x="192" y="16" width="16" height="40" rx="8" fill="#0B4F9E"/>

  <!-- lines of text -->
  <rect x="64" y="80" width="128" height="16" rx="8" fill="#0B4F9E"/>
  <rect x="64" y="112" width="128" height="16" rx="8" fill="#0B4F9E"/>
  <rect x="64" y="144" width="64" height="16" rx="8" fill="#0B4F9E"/>
</svg>
